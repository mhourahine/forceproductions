<section class="hero" id="top">
  <img class="hero__bg"
       src="{{ '/assets/img/site/hero.jpg' | relative_url }}"
       alt="Andy Hourahine on location with camera rigs at a Waterloo Region shoot"
       width="1920" height="1080" fetchpriority="high">
  <div class="hero__scrim" aria-hidden="true"></div>

  <div class="shell hero__inner">
    <h1 class="hero__title">{{ site.tagline }}</h1>
    <p class="hero__sub">
      Our cameras go to the heart of the narrative and capture rich, clear
      images and sound that reflect your world.
    </p>
    <p class="hero__where">
      Video production based in {{ site.locality }}, {{ site.region }}
    </p>
    <div class="hero__actions">
      <a class="btn" href="#work">Watch the reel</a>
      <a class="btn btn--ghost" href="#contact">Start a project</a>
    </div>
  </div>
</section>
