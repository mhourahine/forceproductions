mission: >-
  Force Productions' mission is to help create visual stories that spark
  conversation and initiate positive change. Our cameras go to the heart of the
  narrative and capture rich, clear images and sound that reflect your world.
  Whether it is a service that can change lives, a person who makes a
  difference, or a company looking to stand out from the crowd and be heard,
  Force Productions loves to share stories and ignite inspiration. Your story is
  waiting.

founder_bio: >-
  Passionate storyteller and visual media creator, Andy Hourahine, has dedicated
  his professional life to connecting others to local sources of information and
  inspiration. Andy's hands-on approach to film directing and inbound video
  production begins with the establishment of a real and honest relationship
  with his clients enabling the truest and most engaging stories to surface.
  Andy was awarded the Queen's Diamond Jubilee Medal for his outstanding
  contributions to the community.

