intro: >-
  Share your organization's stories, spark conversations, and generate inbound
  marketing leads through HD video productions such as:

items:
  - title: Mission Videos
    body: >-
      Trust is a key element in any relationship and a good video production
      highlighting your key mission and values allows your customers to see you
      eye-to-eye, learn what drives your company, and start building a positive
      connection.

  - title: Product Videos
    quote: >-
      Viewers of videos are up to 85% more likely to purchase after watching a
      product video.
    body: >-
      You believe your products can positively impact your clients…so show them!
      Your product video can include elements such as customer testimonials,
      product showcase, executive quotes, and will provide information, answer
      key questions, and build brand liking.

  - title: Video Blogs
    quote: >-
      Did you know that videos are up to 50 times more likely to receive a first
      page ranking in search listings compared to a text only page?
    body: >-
      What are you doing today to make your company stronger and the world
      around a better place? Video blogs are an ideal way to tell people why
      your work today is an important piece of your company's history and
      ongoing story. Use them to generate inbound leads, or as a series of video
      conversations that can be repurposed for multi-platform use (e.g. podcast,
      text blog, Twitter campaign).

  - title: Special Projects
    body: >-
      Video projects endure, can help share any part of your organization's
      story in a special way, and interact with your audience in a way no other
      media can. Give some thought to any important element or event to your
      company and you are on your way to outlining your video production for use
      online, in-person, or at events.
