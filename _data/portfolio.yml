#
# TO ADD A VIDEO: copy a block below, change the fields, save.
#   provider : youtube or vimeo
#   id       : the video ID. For YouTube it is the part after "v=" or
#              "youtu.be/". For Vimeo it is the number at the end of the URL.
#   poster   : the still shown before the video is clicked. Put the image file
#              in assets/img/portfolio/ and point to it here.
#   show     : true to display it, false to hide it without deleting it.
#
# TO REORDER: move the blocks around. They appear in the order listed here.
