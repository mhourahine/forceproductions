<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080A">

  {% seo %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="assets/img/site/logo-icon.png">
  <link rel="apple-touch-icon" href="assets/img/site/logo-icon.png">

  {% include schema.html %}
</head>
<body>

<a class="visually-hidden" href="#main">Skip to content</a>

<header class="masthead">
  <div class="shell masthead__inner">
    <a class="masthead__logo" href="#top" aria-label="{{ site.title }} — home">
      {% include brand.html %}
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="#work">Work</a>
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a class="btn" href="#contact">Start a project</a>
    </nav>
  </div>
</header>

<main id="main">
  {{ content }}
</main>

<footer class="footer">
  <div class="shell footer__inner">
    <div class="footer__logo">
      {% include brand.html size="lg" %}
      <p style="margin-top:1.25rem">
        Video production in {{ site.locality }}, {{ site.region }}.<br>
        &copy; {{ 'now' | date: "%Y" }} {{ site.title }}.
      </p>
    </div>
    {% include social.html %}
  </div>
</footer>

<script src="assets/js/lite-video.js" defer></script>
</body>
</html>
